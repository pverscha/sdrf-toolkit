name: Test

on:
  push:
  pull_request:

jobs:
  test-indexing-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: pipelines/ontology-indexing-pipeline
        run: npm ci

      - name: Type check
        working-directory: pipelines/ontology-indexing-pipeline
        run: npm run build

      - name: Run tests
        working-directory: pipelines/ontology-indexing-pipeline
        run: npm test

  test-core:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/core/package-lock.json

      - name: Install dependencies
        working-directory: packages/core
        run: npm ci

      - name: Type check
        working-directory: packages/core
        run: npm run typecheck

      - name: Run tests
        working-directory: packages/core
        run: npm test
